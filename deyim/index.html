.ses{background:none;border:0;font-size:22px;cursor:pointer}
.ortala{text-align:center}
.serit{width:6px;align-self:stretch;border-radius:3px}

function bugun(){ var t=new Date(); return Math.floor((t.getTime()-t.getTimezoneOffset()*60000)/86400000) }

function yaz(d,o){ K.d[d.ad]=o; kaydet() }

function calisildi(){ var b=bugun(); if(K.sonGun===b) return; K.seri=(K.sonGun===b-1)?(K.seri||0)+1:1; K.sonGun=b; kaydet() }
function seri(){ var b=bugun(); return (K.sonGun===b||K.sonGun===b-1)?(K.seri||0):0 }
function ogrendim(d){ var o=kay(d); if(o.k===0){ o.k=1; o.v=bugun()+1; yaz(d,o) } calisildi() }
function tekrarEt(d){ var o=kay(d); o.k=1; o.v=bugun(); yaz(d,o); calisildi() }
function cevap(d,dogru){ var o=kay(d);

function durum(l){ var s=[0,0,0]; l.forEach(function(d){ var k=kutu(d); if(k===0) s[0]++; else if(k<OGRENILDI) s[1]++; else s[2]++ }); return s }

var TR='tr-TR';
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function buyukHarf(s){ return s ? s.charAt(0).toLocaleUpperCase(TR)+s.slice(1) : s }
function karistir(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t } return a }

// Sesli okuma
function oku(metin){
  if(!('speechSynthesis' in window)){ alert('Bu cihazda sesli okuma yok'); return }
  speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(metin); u.lang='tr-TR'; u.rate=0.9;
  var v=speechSynthesis.getVoices().find(function(x){return /^tr/i.test(x.lang)}); if(v) u.voice=v;
  speechSynthesis.speak(u);
}

    var dz=k===0?['Yeni','var(--muted)']:(k>=OGRENILDI?['Öğrenildi ✓','var(--ok)']:['Öğreniliyor','var(--gold)']);
    ekle('<div><div class="ust"><span class="soluk" style="font-weight:700">'+(i+1)+' / '+l.length+'</span><span style="color:'+dz[1]+'">'+dz[0]+'</span></div><div class="cubuk"><i style="background:var(--main);width:'+(100*(i+1)/l.length)+'%"></i></div></div>');
    ekran.appendChild(kartGorunum(d, acik, function(){ acik=true; ciz() }));
    if(acik){
      var r=ekle('<div class="ikili"><button class="dugme d-altin">Tekrar göster</button><button class="dugme d-ok">Öğrendim ✓</button></div>');
      r.children[0].onclick=function(){ tekrarEt(d); sonraki() };
      r.children[1].onclick=function(){ ogrendim(d); sonraki() };
      ekle('<p class="soluk ortala" style="margin:0">Öğrendiğin deyimler, unutmaman için birkaç gün arayla "Bugünkü tekrar"da tekrar sorulur.</p>');
    }
    var g=ekle('<div class="ikili" style="margin-top:8px"><button class="dugme d-soluk">‹ Önceki</button><button class="dugme d-soluk">Sonraki ›</button></div>');
    if(i===0) g.children[0].style.opacity=.4;
    g.children[0].onclick=function(){ if(i>0){ i--; acik=false; ciz() } };
    g.children[1].onclick=sonraki;
  }
  function sonraki(){ if(i<l.length-1){ i++; acik=false; ciz() } else bitti() }
  function bitti(){
    sayfa(grup||'Deyim kartı', grup?ogrenMenu:ana);
    var s=durum(l);
    var k=ekle('<div class="kart ortala"><div class="buyuk">🎉 Bu konunun sonuna geldin!</div><p class="soluk">Çalışılan: '+(s[1]+s[2])+' / '+l.length+'<br>Şimdi bu konudan test çözerek kendini dene.</p><button class="dugme d-ana">Bu konudan test çöz</button><button class="dugme d-cerceve" style="margin-top:10px">Baştan göz at</button></div>');
    var b=k.querySelectorAll('button'); b[0].onclick=function(){ testBasla(l,10,false,grup||'Karışık') }; b[1].onclick=function(){ i=0; acik=false; ciz() };
  }
  ciz();
}

// ---------- Tekrar ----------
function tekrarBasla(){
  var sira=karistir(tekrarListesi()), toplam=sira.length, bildi=0, bilemedi=0, acik=false;
  function ciz(){
    sayfa('Bugünkü tekrar', ana);
    if(!sira.length){
      var k=ekle('<div class="kart ortala"><div class="buyuk">'+(toplam?'🎉 Bugünkü tekrar bitti!':'Bugün tekrar edilecek deyim yok')+'</div><p class="soluk">'+(toplam?'Bildiğin: '+bildi+' · Bilemediğin (sonra bildiğin): '+bilemedi+'<br>Yarın yeni tekrarlar gelecek.':'"Öğren" bölümünden yeni deyimler öğrendikçe tekrarları burada çıkar.')+'</p><button class="dugme d-ana">Yeni deyim öğren</button></div>');
      k.querySelector('button').onclick=ogrenMenu; return;
    }
    var d=sira[0];
    ekle('<div><div class="ust"><span class="soluk" style="font-weight:700">Kalan: '+sira.length+'</span><span style="color:var(--main)">✓ '+bildi+'   ✗ '+bilemedi+'</span></div><div class="cubuk"><i style="width:'+(100*(toplam-sira.length)/Math.max(1,toplam))+'%"></i></div></div>');
    ekle('<p class="soluk ortala" style="margin:0">'+(acik?'Doğru hatırladın mı? Dürüstçe işaretle.':'Önce anlamını içinden söyle, sonra kontrol et.')+'</p>');
    ekran.appendChild(kartGorunum(d, acik, function(){ acik=true; ciz() }));
    if(acik){
      var r=ekle('<div class="ikili"><button class="dugme d-kirmizi">✗ Bilemedim</button><button class="dugme d-ok">✓ Bildim</button></div>');
      r.children[0].onclick=function(){ cevap(d,false); bilemedi++; sira.push(sira.shift()); acik=false; ciz() };
      r.children[1].onclick=function(){ cevap(d,true); bildi++; sira.shift(); acik=false; ciz() };
    }
  }
  ciz();
}

// ---------- Sorular ----------
function celdirici(d,n){
  var ayni=[],diger=[];
  DEYIMLER.forEach(function(o){ if(ayniAnlam(o,d)||o.anlam===d.anlam) return; (o.grup===d.grup?ayni:diger).push(o) });
  karistir(ayni); karistir(diger);
  var out=[]; function ek(o){ if(out.some(function(x){return ayniAnlam(x,o)||x.anlam===o.anlam})) return; out.push(o) }
  ayni.slice(0,2).forEach(ek); diger.forEach(function(o){ if(out.length<n) ek(o) }); ayni.forEach(function(o){ if(out.length<n) ek(o) });
  return out.slice(0,n);
}
function soruKur(s,dogru,yanlislar){ var l=karistir(yanlislar.concat([dogru])); s.secenek=l; s.dogru=l.indexOf(dogru); return s }
function aciklamaDeyim(d){ return '<b>'+esc(buyukHarf(d.ad))+':</b> '+esc(d.anlam)+'.<br><i>'+isaretle(d.ornek)+'</i>' }
function anlamNedir(d){ return soruKur({tip:'Deyimin anlamı',deyim:d,kok:'<i>“'+isaretle(d.ornek)+'”</i><br><br>Bu cümledeki altı çizili deyimin anlamı aşağıdakilerden hangisidir?',aciklama:aciklamaDeyim(d)}, esc(d.anlam), celdirici(d,3).map(function(o){return esc(o.anlam)})) }
function hangiDeyim(d){ return soruKur({tip:'Anlamdan deyime',deyim:d,kok:'<b>“'+esc(d.anlam)+'”</b><br><br>anlamına gelen deyim aşağıdakilerden hangisidir?',aciklama:aciklamaDeyim(d)}, esc(buyukHarf(d.ad)), celdirici(d,3).map(function(o){return esc(buyukHarf(o.ad))})) }
function boslukSoru(d){ return soruKur({tip:'Boşluk doldurma',deyim:d,kok:'<i>“'+bosluk(d.ornek)+'”</i><br><br>Bu cümledeki boşluğa anlamca hangi deyim getirilmelidir?',aciklama:aciklamaDeyim(d)}, esc(buyukHarf(d.ad)), celdirici(d,3).map(function(o){return esc(buyukHarf(o.ad))})) }
function deyimYok(){
  var h=karistir(DEYIMLER.slice()).slice(0,3), dz=esc(DUZ[Math.floor(Math.random()*DUZ.length)]);
  return soruKur({tip:'Deyim bulma',deyim:null,kok:'Aşağıdaki cümlelerin hangisinde <b>deyim yoktur</b>?',aciklama:'Doğru cevapta deyim yok. Diğer cümlelerdeki deyimler:'+h.map(function(o){return '<br>• <b>'+esc(o.ad)+'</b>: '+esc(o.anlam)}).join('')}, dz, h.map(function(o){return duz(o.ornek)}));
}
function gercekAnlam(tercih){
  if(!GERCEK.length) return null;
  var sec=GERCEK.find(function(g){return g.deyim===tercih})||GERCEK[Math.floor(Math.random()*GERCEK.length)];
  var h=[]; GERCEK.forEach(function(g){ if(g.deyim!==sec.deyim && h.indexOf(g.deyim)<0) h.push(g.deyim) });
  karistir(h); h=h.slice(0,3);
  function alti(c){ return esc(c).replace('[','<u><b>').replace(']','</b></u>') }
  return soruKur({tip:'Gerçek anlam / deyim',deyim:null,kok:'Aşağıdaki cümlelerin hangisinde altı çizili söz <b>deyim olarak değil, gerçek anlamıyla</b> kullanılmıştır?',aciklama:'Doğru cevaptaki söz, kelimelerin kendi (gerçek) anlamıyla kullanılmış. Aynı söz deyim olunca anlamı değişir:<br>'+aciklamaDeyim(sec.deyim)}, alti(sec.cumle), h.map(function(o){return alti(o.ornek)}));
}
function soruUret(d,sadeceAnlam){
  var r=Math.random()*100;
  if(!sadeceAnlam){ if(r<10) return deyimYok(); if(r<20){ var g=gercekAnlam(d); if(g) return g } }
  r=Math.random()*100; if(r<45) return anlamNedir(d); if(r<75) return hangiDeyim(d); return boslukSoru(d);
}

// ---------- Test ----------
function testMenu(){
  sayfa('Test çöz', ana);
  ekle('<p class="soluk" style="margin:0">Sorular sınavlarda çıkan tiplerde: deyimin anlamı, anlamdan deyim bulma, boşluk doldurma, deyim içermeyen cümle ve gerçek anlam–deyim ayrımı.</p>');
  secim('Karışık test · 10 soru','Tüm deyimlerden','var(--main)',function(){testBasla(DEYIMLER,10,false,'Karışık 10')});
  secim('Karışık test · 20 soru','Deneme sınavı gibi','var(--main)',function(){testBasla(DEYIMLER,20,false,'Karışık 20')});
  var cal=DEYIMLER.filter(function(d){return kutu(d)>0});
  if(cal.length>=4) secim('Çalıştıklarımdan · 10 soru',cal.length+' deyim arasından','var(--ok)',function(){testBasla(cal,10,false,'Çalıştıklarım')});
  var z=zayiflar(); if(z.length) secim('Yanlışlarımdan',z.length+' deyim','var(--bad)',yanlislardan);
  ekle('<div class="etiket" style="margin-top:8px">Konuya göre · 10 soru</div>');
  GRUPLAR.forEach(function(g){ var l=DEYIMLER.filter(function(d){return d.grup===g}); secim(grupAdi(g),l.length+' deyim','var(--blue)',function(){testBasla(l,10,false,g)}) });
}
function secim(ad,alt,renk,fn){ var b=ekle('<button class="bolum"><span class="serit" style="background:'+renk+'"></span><span><span class="ad">'+esc(ad)+'</span><br><span class="soluk">'+esc(alt)+'</span></span><span class="ok">›</span></button>'); b.onclick=fn }
function yanlislardan(){
  var z=zayiflar();
  if(!z.length){ sayfa('Yanlışlarım', ana); ekle('<div class="kart ortala"><div class="buyuk">Henüz yanlış yaptığın deyim yok 👏</div><p class="soluk">Testlerde yanlış yaptığın deyimler burada toplanır. Doğru bildiğinde listeden çıkar.</p></div>'); return }
  testBasla(z, Math.min(20,z.length), true, 'Yanlışlarım');
}
var saatId=null;
function testBasla(havuz,n,sadeceAnlam,tur){
  var hedef=karistir(havuz.slice()).slice(0,Math.min(n,havuz.length)), no=0, dogruSayi=0, yanlislar=[], bas=Date.now(), soru, secilen=-1, bitti=false;
  function sure(sn){ return Math.floor(sn/60)+':'+('0'+(sn%60)).slice(-2) }
  function cikis(){ if(bitti||confirm('Testten çıkılsın mı? Bu testteki ilerlemen kaydedilmez.')){ clearInterval(saatId); testMenu() } }
  function yeni(){ soru=soruUret(hedef[no],sadeceAnlam); secilen=-1; ciz() }
  function ciz(){
    sayfa(tur, cikis);
    ekle('<div><div class="ust"><span>Soru '+(no+1)+' / '+hedef.length+'</span><span class="soluk" id="saat">⏱ '+sure(Math.floor((Date.now()-bas)/1000))+'</span></div><div class="cubuk"><i style="background:var(--main);width:'+(100*(no+(secilen>=0?1:0))/hedef.length)+'%"></i></div></div>');
    ekle('<div class="kart"><div class="etiket" style="color:var(--main)">'+esc(soru.tip)+'</div><div style="margin-top:8px">'+soru.kok+'</div></div>');
    soru.secenek.forEach(function(s,j){
      var cls=''; if(secilen>=0){ if(j===soru.dogru) cls=' dogru'; else if(j===secilen) cls=' yanlis' }
      var b=ekle('<button class="secenek'+cls+'"><span class="h">'+'ABCD'[j]+'</span><span>'+s+'</span></button>');
      if(secilen<0) b.onclick=function(){ sec(j) };
    });
    if(secilen>=0){
      var ok=secilen===soru.dogru;
      ekle('<div class="kutu '+(ok?'k-yesil':'k-altin')+'"><b style="color:'+(ok?'var(--ok)':'var(--bad)')+'">'+(ok?'✓ Doğru!':'✗ Yanlış. Doğru cevap: '+'ABCD'[soru.dogru])+'</b><div style="margin-top:6px;font-size:15px">'+soru.aciklama+'</div></div>');
      var son=no===hedef.length-1, b=ekle('<button class="dugme d-ana">'+(son?'Sonucu gör':'Sonraki soru ›')+'</button>');
      b.onclick=function(){ if(no<hedef.length-1){ no++; yeni() } else sonuc() };
    }
  }
  function sec(j){ if(secilen>=0) return; secilen=j; var ok=j===soru.dogru; if(ok) dogruSayi++; else yanlislar.push(soru); if(soru.deyim) cevap(soru.deyim,ok); else calisildi(); ciz() }
  function sonuc(){
    bitti=true; clearInterval(saatId);
    var sn=Math.floor((Date.now()-bas)/1000), n=hedef.length, y=Math.round(100*dogruSayi/n);
    K.testler.push({t:Date.now(),tur:tur,s:n,d:dogruSayi,sn:sn}); if(K.testler.length>100) K.testler=K.testler.slice(-100); kaydet();
    sayfa('Sonuç', testMenu);
    var msj=y>=90?'🏆 Harika!':y>=70?'👏 Çok iyi!':y>=50?'🙂 Fena değil, biraz daha tekrar':'💪 Tekrar etmeye devam!';
    ekle('<div class="kart ortala"><div class="buyuk">'+msj+'</div><div style="font-size:44px;font-weight:800;color:'+(y>=70?'var(--ok)':y>=50?'var(--gold)':'var(--bad)')+'">%'+y+'</div><div class="soluk" style="font-weight:700">Doğru '+dogruSayi+' · Yanlış '+(n-dogruSayi)+' · Süre '+sure(sn)+'</div></div>');
    if(yanlislar.length){
      ekle('<div class="etiket" style="color:var(--bad)">Yanlış yaptıkların</div>');
      var tekrar=[]; yanlislar.forEach(function(s){ ekle('<div class="kart" style="font-size:15px">'+s.aciklama+'</div>'); if(s.deyim && tekrar.indexOf(s.deyim)<0) tekrar.push(s.deyim) });
      if(tekrar.length){ var b=ekle('<button class="dugme d-bad">Yanlışları yeniden çöz</button>'); b.onclick=function(){ testBasla(tekrar,tekrar.length,true,'Yanlışları yeniden') } }
    }
    var y1=ekle('<button class="dugme d-ana">Yeni test</button>'); y1.onclick=testMenu;
    var y2=ekle('<button class="dugme d-cerceve">Ana sayfa</button>'); y2.onclick=ana;
  }
  clearInterval(saatId);
  saatId=setInterval(function(){ var s=document.getElementById('saat'); if(s&&!bitti) s.textContent='⏱ '+sure(Math.floor((Date.now()-bas)/1000)) },1000);
  yeni();
}

// ---------- Liste ----------
function liste(q){
  sayfa('Deyim listesi', ana);
  var ara=ekle('<input type="search" placeholder="Deyim ya da anlam ara…" autocomplete="off">'); ara.value=q;
  var kap=ekle('<div style="display:flex;flex-direction:column;gap:6px"></div>');
  function doldur(){
    var s=ara.value.trim().toLocaleLowerCase(TR), grup=null, say=0; kap.innerHTML='';
    DEYIMLER.forEach(function(d){
      if(s && d.ad.toLocaleLowerCase(TR).indexOf(s)<0 && d.anlam.toLocaleLowerCase(TR).indexOf(s)<0) return;
      if(d.grup!==grup){ grup=d.grup; kap.appendChild(el('<div class="etiket" style="color:var(--main);margin-top:10px">'+esc(grupAdi(grup))+'</div>')) }
      var k=kutu(d), isr=k===0?'':(k>=OGRENILDI?'<b style="color:var(--ok)">✓</b>':'<b style="color:var(--gold)">•</b>');
      var o=el('<div class="liste-ogesi satir"><div><b>'+esc(buyukHarf(d.ad))+'</b><br><span class="soluk">'+esc(d.anlam)+'</span></div>'+isr+'</div>');
      o.onclick=function(){ kartlar(d.grup, d.ad) }; kap.appendChild(o); say++;
    });
    if(!say) kap.appendChild(el('<p class="soluk">Bulunamadı.</p>'));
  }
  ara.oninput=doldur; doldur();
}

// ---------- İlerleme ----------
function ilerleme(){
  sayfa('İlerleme', ana);
  var h='<div class="etiket">Konulara göre öğrenilen</div><div class="kart">';
  GRUPLAR.forEach(function(g,i){ var l=DEYIMLER.filter(function(d){return d.grup===g}), s=durum(l);
    h+='<div class="satir" style="margin-top:'+(i?12:0)+'px"><b style="font-size:14px">'+esc(grupAdi(g))+'</b><b style="color:var(--ok);font-size:14px">'+s[2]+'/'+l.length+'</b></div><div class="cubuk"><i style="width:'+(100*s[2]/l.length)+'%"></i></div>' });
  ekle('<div>'+h+'</div></div>');
  var t=K.testler.slice(-15).reverse(), th='<div class="etiket">Son testler</div><div class="kart">';
  if(!t.length) th+='<span class="soluk">Henüz test çözülmedi.</span>';
  t.forEach(function(o,i){ var y=Math.round(100*o.d/Math.max(1,o.s)), tar=new Date(o.t).toLocaleString(TR,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    th+='<div class="satir" style="margin-top:'+(i?10:0)+'px"><div><b>'+esc(o.tur)+'</b><br><span class="soluk" style="font-size:12px">'+tar+' · '+o.d+'/'+o.s+' doğru · '+Math.floor(o.sn/60)+' dk '+(o.sn%60)+' sn</span></div><b style="font-size:18px;color:'+(y>=70?'var(--ok)':y>=50?'var(--gold)':'var(--bad)')+'">%'+y+'</b></div>' });
  ekle('<div>'+th+'</div></div>');
  var zor=DEYIMLER.filter(function(d){return kay(d).y>0}).sort(function(a,b){return kay(b).y-kay(a).y}).slice(0,10);
  if(zor.length) ekle('<div><div class="etiket">En çok zorlandığın deyimler</div><div class="kart" style="font-size:14px">'+zor.map(function(d){return '<div style="margin-top:6px"><b>'+esc(d.ad)+'</b> — '+esc(d.anlam)+' <span style="color:var(--bad)">('+kay(d).y+' yanlış)</span></div>'}).join('')+'</div></div>');
  var s=ekle('<button class="dugme d-kirmizi" style="margin-top:12px">İlerlemeyi sıfırla</button>');
  s.onclick=function(){ if(confirm('İlerleme sıfırlansın mı? Öğrenilen deyimler, tekrarlar ve test geçmişi silinir. Bu geri alınamaz.')){ K={d:{},sonGun:0,seri:0,testler:[]}; kaydet(); ilerleme() } };
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}) }
ana();
</script>
